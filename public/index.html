<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Menu Board</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #0b0f17;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    #board {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      padding: 2rem 2.5rem;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 1.25rem;
      border-bottom: 2px solid #1e293b;
      margin-bottom: 1.5rem;
      flex-shrink: 0;
    }

    .title-group {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .brand-title {
      font-size: 2.5rem;
      font-weight: 800;
      color: #fbbf24;
      letter-spacing: -0.02em;
      text-transform: uppercase;
    }

    .brand-subtitle {
      font-size: 1rem;
      color: #94a3b8;
    }

    .subtitle-badge {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background-color: #1e293b;
      border: 1px solid #334155;
      padding: 0.5rem 1.25rem;
      border-radius: 9999px;
      font-size: 1.1rem;
      font-weight: 600;
      color: #38bdf8;
    }

    .live-dot {
      width: 10px;
      height: 10px;
      background-color: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 8px #22c55e;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
      flex-grow: 1;
      height: 100%;
      overflow: hidden;
    }

    .category-card {
      background: rgba(30, 41, 59, 0.4);
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .category-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 1rem;
      border-bottom: 1px solid #334155;
      padding-bottom: 0.5rem;
      text-transform: capitalize;
    }

    .item-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .item-img {
      width: 52px;
      height: 52px;
      border-radius: 8px;
      object-fit: cover;
      flex-shrink: 0;
      border: 1px solid #334155;
    }

    .item-details {
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 0.5rem;
    }

    .item-name {
      font-size: 1.1rem;
      font-weight: 600;
      color: #f1f5f9;
    }

    .item-price {
      font-size: 1.15rem;
      font-weight: 700;
      color: #fbbf24;
      white-space: nowrap;
    }

    .item-desc {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-top: 0.2rem;
      line-height: 1.25;
    }

    body.rtl {
      direction: rtl;
    }
  </style>
</head>
<body>

  <div id="board">
    <header class="header">
      <div class="title-group">
        <h1 class="brand-title" id="restaurant-name">PolyGlot menu</h1>
        <p class="brand-subtitle" id="restaurant-subtitle">Loading Menu...</p>
      </div>
      <div class="subtitle-badge">
        <span class="live-dot"></span>
        <span id="detected-language">English</span>
      </div>
    </header>

    <main class="grid-container" id="menu-grid">
      <!-- Categories load dynamically -->
    </main>
  </div>

  <script>
    const restaurantNameEl = document.getElementById('restaurant-name');
    const restaurantSubtitleEl = document.getElementById('restaurant-subtitle');
    const languageBadgeEl = document.getElementById('detected-language');
    const menuGridEl = document.getElementById('menu-grid');

    function renderMenu(data) {
      if (!data) return;

      if (data.isRTL) {
        document.body.classList.add('rtl');
      } else {
        document.body.classList.remove('rtl');
      }

      restaurantNameEl.textContent = data.restaurantName || "PolyGlot menu";
      restaurantSubtitleEl.textContent = data.subtitle || "";
      languageBadgeEl.textContent = data.detectedLanguage || data.language || "English";

      menuGridEl.innerHTML = '';

      const categories = data.categories || data.menu || data.items;

      if (categories && Array.isArray(categories)) {
        categories.forEach(cat => {
          const card = document.createElement('div');
          card.className = 'category-card';

          const title = cat.categoryName || cat.name || cat.category || "Items";
          const itemsList = cat.items || [];

          let itemsHTML = '';
          itemsList.forEach(item => {
            const itemName = item.name || item.title || "";
            const itemDesc = item.desc || item.description || "";
            const itemPrice = item.price || "";
            const itemImg = item.image || "";

            itemsHTML += `
              <div class="menu-item">
                ${itemImg ? `<img src="${itemImg}" class="item-img" alt="${itemName}">` : ''}
                <div class="item-details">
                  <div class="item-header">
                    <span class="item-name">${itemName}</span>
                    <span class="item-price">${itemPrice}</span>
                  </div>
                  <span class="item-desc">${itemDesc}</span>
                </div>
              </div>
            `;
          });

          card.innerHTML = `
            <h2 class="category-title">${title}</h2>
            <div class="item-list">${itemsHTML}</div>
          `;

          menuGridEl.appendChild(card);
        });
      }
    }

    // Connect SSE stream
    const evtSource = new EventSource('/events');

    evtSource.onmessage = function(event) {
      try {
        const updatedMenu = JSON.parse(event.data);
        renderMenu(updatedMenu);
      } catch (err) {
        console.error("Error parsing menu update:", err);
      }
    };

    evtSource.onerror = function(err) {
      console.warn("SSE stream disconnected. Reconnecting...");
    };
  </script>
</body>
</html>
