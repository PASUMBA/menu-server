<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Menu Board</title>
  <style>
    /* Absolute reset for digital screen displays */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none; /* Prevents text selection on display monitors */
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden; /* Strict zero-scrolling guarantee */
      background-color: #0b0f17; /* Deep matte black background */
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Master Board Container */
    #board {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      padding: 2.5rem 3rem;
    }

    /* Header Section */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 1.5rem;
      border-bottom: 2px solid #1e293b;
      margin-bottom: 2rem;
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 2.75rem;
      font-weight: 800;
      color: #fbbf24; /* Warm Gold Accent */
      letter-spacing: -0.02em;
      text-transform: uppercase;
    }

    .subtitle-badge {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background-color: #1e293b;
      border: 1px solid #334155;
      padding: 0.6rem 1.25rem;
      border-radius: 9999px;
      font-size: 1.1rem;
      font-weight: 600;
      color: #38bdf8;
    }

    .live-dot {
      width: 10px;
      height: 10px;
      background-color: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 8px #22c55e;
    }

    /* Full-Bleed Grid for Menu Columns */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 2rem;
      flex-grow: 1;
      height: 100%;
      overflow: hidden;
    }

    .category-card {
      background: rgba(30, 41, 59, 0.4);
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 1.75rem;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .category-title {
      font-size: 1.6rem;
      font-weight: 700;
      color: #f8fafc;
      margin-bottom: 1.25rem;
      border-bottom: 1px solid #334155;
      padding-bottom: 0.5rem;
      text-transform: capitalize;
    }

    /* Item rows layout */
    .item-list {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      justify-content: flex-start;
    }

    .menu-item {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
    }

    .item-details {
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .item-name {
      font-size: 1.2rem;
      font-weight: 600;
      color: #f1f5f9;
    }

    .item-desc {
      font-size: 0.925rem;
      color: #94a3b8;
      margin-top: 0.25rem;
      line-height: 1.3;
    }

    .item-price {
      font-size: 1.25rem;
      font-weight: 700;
      color: #fbbf24;
      white-space: nowrap;
    }

    /* Right-To-Left (RTL) Auto-Layout */
    body.rtl {
      direction: rtl;
    }
  </style>
</head>
<body>

  <div id="board">
    <header class="header">
      <h1 class="brand-title" id="restaurant-name">PASU BISTRO</h1>
      <div class="subtitle-badge">
        <span class="live-dot"></span>
        <span id="detected-language">English</span>
      </div>
    </header>

    <main class="grid-container" id="menu-grid">
      <!-- Dynamically populated via SSE without page reload -->
    </main>
  </div>

  <script>
    const restaurantNameEl = document.getElementById('restaurant-name');
    const languageBadgeEl = document.getElementById('detected-language');
    const menuGridEl = document.getElementById('menu-grid');

    // Render Menu Cards with flexible property checks
    function renderMenu(data) {
      if (!data) return;

      // Update RTL body direction for languages like Arabic/Hebrew
      if (data.isRTL) {
        document.body.classList.add('rtl');
      } else {
        document.body.classList.remove('rtl');
      }

      // Update Title & Badge
      restaurantNameEl.textContent = data.restaurantName || "PASU BISTRO";
      languageBadgeEl.textContent = data.detectedLanguage || data.language || "English";

      // Clear grid
      menuGridEl.innerHTML = '';

      // Flexible check for category array
      const categories = data.categories || data.menu || data.items;

      if (categories && Array.isArray(categories)) {
        categories.forEach(cat => {
          const card = document.createElement('div');
          card.className = 'category-card';

          const title = cat.categoryName || cat.name || cat.category || "Items";
          const itemsList = cat.items || [];

          let itemsHTML = '';
          itemsList.forEach(item => {
            const itemName = item.name || item.title || "";
            const itemDesc = item.desc || item.description || "";
            const itemPrice = item.price || "";

            itemsHTML += `
              <div class="menu-item">
                <div class="item-details">
                  <span class="item-name">${itemName}</span>
                  <span class="item-desc">${itemDesc}</span>
                </div>
                <span class="item-price">${itemPrice}</span>
              </div>
            `;
          });

          card.innerHTML = `
            <h2 class="category-title">${title}</h2>
            <div class="item-list">${itemsHTML}</div>
          `;

          menuGridEl.appendChild(card);
        });
      }
    }

    // Connect to Render SSE for instant voice updates
    const evtSource = new EventSource('/api/events');

    evtSource.onmessage = function(event) {
      try {
        const updatedMenu = JSON.parse(event.data);
        renderMenu(updatedMenu);
      } catch (err) {
        console.error("Error parsing menu update:", err);
      }
    };

    evtSource.onerror = function(err) {
      console.warn("SSE connection interrupted. Reconnecting automatically...");
    };
  </script>
</body>
</html>
