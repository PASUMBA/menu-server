<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Menu Translation</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f6f8; margin: 0; padding: 20px; color: #333; }
    .container { max-width: 700px; margin: auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    h1 { margin-top: 0; color: #1a1a1a; }
    .badge { display: inline-block; background: #2563eb; color: #fff; padding: 4px 12px; border-radius: 20px; font-size: 0.85rem; margin-bottom: 20px; }
    .category-title { border-bottom: 2px solid #2563eb; padding-bottom: 5px; color: #2563eb; margin-top: 30px; }
    .item { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #eee; }
    .item-info { max-width: 80%; }
    .item-name { font-weight: bold; font-size: 1.05rem; }
    .item-desc { font-size: 0.9rem; color: #666; margin-top: 4px; }
    .item-price { font-weight: bold; color: #1a1a1a; }
    .rtl { direction: rtl; text-align: right; }
  </style>
</head>
<body>
  <div class="container" id="menu-container">
    <span class="badge" id="lang-badge">Detected Language: English</span>
    <h1 id="restaurant-name">Loading Menu...</h1>
    <p id="restaurant-subtitle"></p>
    <div id="categories-container"></div>
  </div>

  <script>
    const evtSource = new EventSource("/events");

    evtSource.onmessage = function(event) {
      const data = JSON.parse(event.data);
      console.log("Received menu update:", data);

      const container = document.getElementById("menu-container");
      if (data.isRTL) {
        container.classList.add("rtl");
      } else {
        container.classList.remove("rtl");
      }

      document.getElementById("lang-badge").innerText = "Detected Language: " + (data.detectedLanguage || "English");
      document.getElementById("restaurant-name").innerText = data.restaurantName || "Pasu's Bistro";
      document.getElementById("restaurant-subtitle").innerText = data.subtitle || "";

      const categoriesDiv = document.getElementById("categories-container");
      categoriesDiv.innerHTML = "";

      if (data.categories && data.categories.length > 0) {
        data.categories.forEach(cat => {
          const catHeader = document.createElement("h2");
          catHeader.className = "category-title";
          catHeader.innerText = cat.categoryName;
          categoriesDiv.appendChild(catHeader);

          cat.items.forEach(item => {
            const itemDiv = document.createElement("div");
            itemDiv.className = "item";
            itemDiv.innerHTML = `
              <div class="item-info">
                <div class="item-name">${item.name}</div>
                <div class="item-desc">${item.desc}</div>
              </div>
              <div class="item-price">${item.price}</div>
            `;
            categoriesDiv.appendChild(itemDiv);
          });
        });
      }
    };

    evtSource.onerror = function(err) {
      console.error("SSE Connection error:", err);
    };
  </script>
</body>
</html>
